<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="100%" height="100%" viewBox="0 0 512 512" version="1.1"
     xmlns="http://www.w3.org/2000/svg" xml:space="preserve"
     style="fill-rule:evenodd;clip-rule:evenodd;stroke-linejoin:round;stroke-miterlimit:2;">
    <defs>
        <clipPath id="rounded"><rect height="512" rx="112" ry="112" width="512" x="0" y="0"/></clipPath>
      <filter height="180%" id="softshadow" width="180%" x="-40%" y="-40%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="15"/>
        <feOffset dx="0" dy="16" result="o"/>
        <feComponentTransfer><feFuncA slope="0.42" type="linear"/></feComponentTransfer>
        </filter>
    </defs>
  <!-- Brand background (bright blue) -->
  <rect height="512" rx="112" ry="112" style="fill:rgb(0,96,197);" width="512" x="0" y="0"/>
  <!-- Faint shadow behind the character (clipped to the rounded background) -->
  <g clip-path="url(#rounded)">
        <path d="M401,75L401,437L111,437L111,75L198,75L198,170.93L314,170.93L314,75Z" filter="url(#softshadow)"
              style="fill:rgb(0,0,0);"/>
    </g>
  <!-- Noppe mark: body with two ears (top tabs + center notch) -->
  <path d="M401,75L401,437L111,437L111,75L198,75L198,170.93L314,170.93L314,75Z" style="fill:white;"/>
  <!-- Round eyes (background color) -->
  <circle cx="179.15" cy="272.29" r="30" style="fill:rgb(0,96,197);"/>
  <circle cx="332.85" cy="272.29" r="30" style="fill:rgb(0,96,197);"/>
</svg>
